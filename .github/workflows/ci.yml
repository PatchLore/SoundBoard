name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Show workspace
        run: |
          pwd
          ls -la
          ls -la stream-soundboard || true

      - name: Install dependencies
        run: |
          cd stream-soundboard
          npm ci

      - name: Run tests
        run: |
          cd stream-soundboard
          npm test --silent

      - name: Build
        run: |
          cd stream-soundboard
          npm run build
